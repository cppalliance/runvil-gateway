[workspace]
# The gateway is the only release artifact in this repository.
members = ["cargo:crates/gateway/app"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax): the five
# triples the project ships. The gateway build cross-compiles nothing; each
# triple builds natively (see the custom runners below).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Where to publish releases
hosting = "github"
# Only gateway-v* tags start a release.
tag-namespace = "gateway-v"
# The gateway build compiles the config UI with esbuild, so the build
# machines need Node 22 and the npm installs first.
github-build-setup = "dist-ci/build-setup.yml"
# Validate the release plan on pull requests without building anything.
pr-run-mode = "plan"
# The generated release workflow includes the custom release-test condition
# below, so cargo-dist must preserve that intentional CI customization.
allow-dirty = ["ci"]
# The release gate: install and run the built archive on a clean machine
# before the GitHub Release is created. github-release = "announce" defers
# the release creation to the announce step, which needs the gate, so a
# failed test means no release. (Safe here because no package-manager
# publish jobs reference the release URL.)
host-jobs = ["./gateway-release-test"]
github-release = "announce"
# NOTE: cargo-dist's generated announce job does not check the host-job's
# result, so .github/workflows/gateway-v-release.yml contains a
# hand-edit adding `needs.custom-gateway-release-test.result == 'success'`
# to the announce condition. Re-apply it after every `cargo dist generate`.

# Build each Linux architecture on a native runner: the gateway compiles C
# dependencies, which cross-compilers mishandle.
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
