# Injected into cargo-dist's build-local-artifacts job (github-build-setup
# in dist-workspace.toml). The gateway build bundles the config UI with
# esbuild, which needs Node 22 and the npm install. Keep in sync with the
# setup steps in ci.yml. Every step needs a `name`, and only
# name/uses/with/run survive the cargo-dist template, so the npm path goes
# through the prefix flag rather than working-directory.
- name: Set up Node.js 22
  uses: actions/setup-node@v4
  with:
    node-version: 22
    cache: npm
    cache-dependency-path: crates/gateway/config-ui/ui/package-lock.json
- name: Install config UI dependencies
  run: npm ci --prefix crates/gateway/config-ui/ui
