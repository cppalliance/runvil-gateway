name: llama-cuda-blackwell

# Builds the Blackwell CUDA llama-server release zip on a GitHub-hosted
# Windows computer (no GPU needed to compile), smoke-tests it on our
# self-hosted GPU computer, and publishes a GitHub Release the gateway
# downloads at run time (the `cuda-blackwell` row in
# crates/gateway/local/src/artifacts/assets.rs).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: llama.cpp release tag to build (for example b10082)
        required: true
        default: "b10082"

permissions:
  contents: read

concurrency:
  group: llama-cuda-blackwell-${{ inputs.tag || 'b10082' }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || 'b10082' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check out llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.TAG }}
          path: llama.cpp

      # Jimver/cuda-toolkit's local installer crashes on windows-2022 with
      # exit code 0xE0FF0009 (issues 382, 395, 436). The workaround from
      # those issues: run the NVIDIA network installer directly. The `-s`
      # and `-n` flags mean silent and install-all; `-n` avoids sub-package
      # naming differences between toolkit versions.
      - name: Install the CUDA toolkit
        shell: bash
        timeout-minutes: 30
        run: |
          version="13.2.0"
          short="13.2"
          url="https://developer.download.nvidia.com/compute/cuda/${version}/network_installers/cuda_${version}_windows_network.exe"
          echo "Downloading CUDA $version network installer..."
          curl -Lo cuda_installer.exe "$url"
          echo "Installing CUDA $version (this takes ~20 minutes)..."
          ./cuda_installer.exe -s -n
          rm -f cuda_installer.exe
          cuda_path="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v${short}"
          if [ ! -f "$cuda_path/bin/nvcc.exe" ]; then
            echo "nvcc not found at $cuda_path, searching..."
            find "C:/Program Files/NVIDIA GPU Computing Toolkit" -name nvcc.exe 2>/dev/null || true
            exit 1
          fi
          echo "CUDA installed at $cuda_path"
          echo "CUDA_PATH=$cuda_path" >> "$GITHUB_ENV"
          # MSBuild's CUDA targets look for the versioned variable first.
          echo "CUDA_PATH_V${short//./_}=$cuda_path" >> "$GITHUB_ENV"
          echo "$cuda_path/bin" >> "$GITHUB_PATH"

      - name: Build the release zip
        run: cargo run --locked -p build-llama-cuda -- --source llama.cpp --tag ${{ env.TAG }} --arch 120a-real --no-smoke --out dist/

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-blackwell-${{ env.TAG }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/llama-cuda-manifest.json
          if-no-files-found: error

      # Say why the rest of the run does nothing, rather than leaving two
      # skipped jobs with no explanation.
      - name: Report the skipped GPU smoke
        if: vars.RUNVIL_CUDA_RUNNER != 'true'
        shell: bash
        run: |
          echo "the smoke and publish jobs are skipped: no runner with the self-hosted, windows, and cuda labels is registered on $GITHUB_REPOSITORY"
          echo "::notice title=llama-cuda-blackwell stops after build::the CUDA smoke test needs a self-hosted GPU runner. Register one with the self-hosted, windows, and cuda labels, set the RUNVIL_CUDA_RUNNER repository variable to true, and re-run. The built zip is attached to this run as an artifact."

  smoke:
    needs: build
    # The GPU smoke needs a self-hosted Windows CUDA runner, which is not
    # registered on this repository yet. A job naming an unregistered runner
    # queues forever and never reports, so it is gated on the
    # RUNVIL_CUDA_RUNNER repository variable. With the variable false the
    # build still runs and its artifact is downloadable; only the smoke and
    # the publish that depends on it are skipped.
    if: vars.RUNVIL_CUDA_RUNNER == 'true'
    runs-on: [self-hosted, windows, cuda]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-cuda-blackwell-${{ env.TAG }}
          path: dist

      - name: Verify the checksum and unpack
        shell: powershell
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $recorded = (Get-Content "$($zip.FullName).sha256" -Raw).Split(' ')[0].Trim()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($recorded -ne $actual) { throw "sha256 mismatch for $($zip.Name): recorded $recorded, got $actual" }
          Expand-Archive -Path $zip.FullName -DestinationPath dist\server -Force
          if (-not (Test-Path dist\server\llama-server.exe)) { throw "llama-server.exe missing from the zip" }

      - name: Smoke test lists a CUDA device
        shell: powershell
        run: |
          $output = & dist\server\llama-server.exe --list-devices 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "llama-server --list-devices exited $LASTEXITCODE`n$output" }
          if ($output -notmatch "CUDA") { throw "no CUDA device in --list-devices output`n$output" }
          $output

      # The full live CUDA test (multi-gigabyte model downloads, completions)
      # is opt-in from a developer machine; the release smoke only verifies
      # the built binary sees CUDA devices, which the step above covers.

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-cuda-blackwell-${{ env.TAG }}
          path: dist

      - name: Assemble SHA256SUMS
        working-directory: dist
        run: cp llama-server-cuda-blackwell-*.zip.sha256 SHA256SUMS

      # A published asset is pinned by a sha256 in the gateway, so an upload
      # that replaces one with different bytes breaks every gateway that
      # already points at it. Read the release's own digests first: an asset
      # that already matches is left alone, an asset that differs stops the
      # job, and only an asset the release lacks gets uploaded.
      - name: Check the release for conflicting assets
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GH_REPO="$GITHUB_REPOSITORY" LC_ALL=C
          release="llama-cuda-blackwell-$TAG"
          shopt -s nullglob
          local_files=(dist/*.zip dist/SHA256SUMS dist/llama-cuda-manifest.json)
          if ((${#local_files[@]} == 0)); then
            echo "dist/ holds no file to publish" >&2
            exit 1
          fi
          view_err="$RUNNER_TEMP/release-view.err"
          if ! assets="$(gh release view "$release" --json assets \
            --jq '.assets[] | "\(.name)\t\(.digest // "")"' 2>"$view_err")"; then
            if ! grep -q 'release not found' "$view_err"; then
              cat "$view_err" >&2
              exit 1
            fi
            assets=""
          fi
          upload=()
          for path in "${local_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "the build did not produce $path" >&2
              exit 1
            fi
            name="${path##*/}"
            want="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
            have="$(awk -F'\t' -v name="$name" '$1 == name { print $2; exit }' <<<"$assets")"
            present="$(awk -F'\t' -v name="$name" '$1 == name { print "yes"; exit }' <<<"$assets")"
            if [[ -z "$present" ]]; then
              upload+=("$path")
            elif [[ -z "$have" ]]; then
              echo "$release holds $name but reports no digest, and $path has digest $want." \
                "The release asset cannot be compared with this build, so the upload stops instead of replacing it." >&2
              exit 1
            elif [[ "$have" == "$want" ]]; then
              echo "$release already holds $name with $want; it stays as it is"
            else
              echo "$release holds $name with digest $have, but $path has digest $want." \
                "The release asset differs from this build, so the upload stops instead of replacing it." >&2
              exit 1
            fi
          done
          if ((${#upload[@]} == 0)); then
            echo "$release already holds every asset of this build; nothing to upload"
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "files<<RUNVIL_ASSETS"
            printf '%s\n' "${upload[@]}"
            echo "RUNVIL_ASSETS"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.assets.outputs.files != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: llama-cuda-blackwell-${{ env.TAG }}
          name: llama-cuda-blackwell-${{ env.TAG }}
          files: ${{ steps.assets.outputs.files }}
